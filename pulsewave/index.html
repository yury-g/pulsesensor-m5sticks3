<!doctype html>
<meta charset="utf-8">
<title>PulseWave</title>
<style>
  :root { --ink:#e8eef7; --dim:#8fa3bd; --panel:#141c28; --trace:#ff5a5f; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#0a0f16; color:var(--ink);
              font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:14px; padding:22px; }
  canvas { background:#0d1420; border-radius:12px; box-shadow:0 12px 40px #0008;
           max-width:96vw; height:auto; }
  #bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { font:600 15px/1 inherit; padding:11px 18px; border-radius:9px; border:0;
           background:#2f7ef7; color:#fff; cursor:pointer; }
  button:hover:not(:disabled) { background:#4a90ff; }
  button:disabled { background:#2a3546; color:#6b7a8f; cursor:default; }
  #pill { padding:7px 13px; border-radius:999px; background:var(--panel); color:var(--dim);
          font-weight:600; font-size:13px; }
  #pill.on { background:#0f3d24; color:#4ade80; }
  #pill.err { background:#3d1616; color:#f87171; }
  #stats { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; color:var(--dim);
           font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  #stats b { color:var(--ink); font-weight:700; }
</style>

<canvas id="c" width="960" height="420"></canvas>
<div id="stats">
  <span>rate <b id="s-rate">—</b> Hz</span>
  <span>jitter <b id="s-jit">—</b> µs</span>
  <span>dropped <b id="s-drop">—</b></span>
  <span>packets <b id="s-pkt">—</b>/s</span>
  <span>signal <b id="s-span">—</b> counts</span>
</div>
<div id="bar">
  <button id="connect">Connect sensor</button>
  <span id="pill">not connected</span>
</div>

<script>
// ---------------------------------------------------------------- constants
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const WINDOW_S = 7;                 // seconds of history on screen
const WRAP = 2 ** 30;               // MicroPython ticks_us wrap

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const PAD_L = 52, PAD_R = 12, PAD_T = 14, PAD_B = 26;
const PLOT_W = W - PAD_L - PAD_R, PLOT_H = H - PAD_T - PAD_B;

// ---------------------------------------------------------------- data
// One ring of (t_us, value). Sized from the nominal rate once we see a packet.
let ring = null, cap = 0, head = 0, filled = 0;
let rate = 250, nextIndex = null, dropped = 0;
let tOff = 0, tPrev = null;          // ticks_us unwrapping
let pktTimes = [];                   // arrival times, for packets/s
let steps = [];                      // per-packet mean sample interval, for jitter

function initRing(hz) {
  rate = hz;
  cap = Math.ceil(hz * (WINDOW_S + 1.5));
  ring = { t: new Float64Array(cap), v: new Uint16Array(cap) };
  head = 0; filled = 0;
}

function push(t, v) {
  ring.t[head] = t; ring.v[head] = v;
  head = (head + 1) % cap;
  if (filled < cap) filled++;
}

function onPacket(view) {
  if (view.byteLength < 12) return;
  const first = view.getUint32(0, true);
  const n     = view.getUint16(4, true);
  const hz    = view.getUint16(6, true);
  let   t_us  = view.getUint32(8, true);
  if (view.byteLength < 12 + 2 * n) return;
  if (!ring || hz !== rate) initRing(hz);

  // unwrap the device clock
  if (tPrev !== null && t_us + tOff < tPrev) tOff += WRAP;
  const t0 = t_us + tOff;
  if (tPrev !== null && t0 > tPrev) {
    const di = first - lastFirst;
    if (di > 0) steps.push((t0 - tPrev) / di);
    if (steps.length > 120) steps.shift();
  }
  tPrev = t0; lastFirst = first;

  // sample indices are absolute, so a gap is unambiguous packet loss
  if (nextIndex !== null && first > nextIndex) dropped += first - nextIndex;
  nextIndex = first + n;

  const dt = 1e6 / hz;
  for (let i = 0; i < n; i++) push((t0 + i * dt) / 1e6, view.getUint16(12 + 2 * i, true));

  const now = performance.now();
  pktTimes.push(now);
  while (pktTimes.length && now - pktTimes[0] > 2000) pktTimes.shift();
}
let lastFirst = 0;

// ---------------------------------------------------------------- drawing
let loY = 0, hiY = 4095;             // smoothed auto-scale

function draw() {
  requestAnimationFrame(draw);
  ctx.fillStyle = '#0d1420'; ctx.fillRect(0, 0, W, H);

  if (!ring || filled < 4) {
    ctx.fillStyle = '#8fa3bd'; ctx.font = '600 17px ui-sans-serif,system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Connect the stick to see the pulse waveform', W / 2, H / 2);
    ctx.textAlign = 'left';
    return;
  }

  // newest sample defines the right edge; window is exactly WINDOW_S wide
  const newest = ring.t[(head - 1 + cap) % cap];
  const tMin = newest - WINDOW_S;

  // autoscale to what is visible, then ease toward it so the trace sits still
  let lo = Infinity, hi = -Infinity;
  for (let k = 0; k < filled; k++) {
    const i = (head - 1 - k + cap * 2) % cap;
    if (ring.t[i] < tMin) break;
    const v = ring.v[i];
    if (v < lo) lo = v;
    if (v > hi) hi = v;
  }
  if (hi - lo < 40) { const m = (hi + lo) / 2; lo = m - 20; hi = m + 20; }
  const pad = (hi - lo) * 0.12;
  lo -= pad; hi += pad;
  loY += (lo - loY) * 0.08; hiY += (hi - hiY) * 0.08;

  const xOf = t => PAD_L + (t - tMin) / WINDOW_S * PLOT_W;
  const yOf = v => PAD_T + PLOT_H - (v - loY) / (hiY - loY) * PLOT_H;

  // grid: one line per second, plus the value axis
  ctx.strokeStyle = '#1b2740'; ctx.lineWidth = 1;
  ctx.fillStyle = '#5c6f8a'; ctx.font = '11px ui-monospace,Menlo,monospace';
  for (let s = 0; s <= WINDOW_S; s++) {
    const x = Math.round(PAD_L + s / WINDOW_S * PLOT_W) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, PAD_T); ctx.lineTo(x, PAD_T + PLOT_H); ctx.stroke();
    ctx.fillText((s - WINDOW_S) + 's', x - 10, H - 9);
  }
  for (let g = 0; g <= 4; g++) {
    const y = Math.round(PAD_T + g / 4 * PLOT_H) + 0.5;
    ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(PAD_L + PLOT_W, y); ctx.stroke();
    ctx.fillText(String(Math.round(hiY - g / 4 * (hiY - loY))), 8, y + 4);
  }

  // Min/max decimation per column: with ~1750 samples over ~900px every sample
  // still influences the picture, so no peak is ever skipped over.
  const colMin = new Float64Array(PLOT_W).fill(Infinity);
  const colMax = new Float64Array(PLOT_W).fill(-Infinity);
  for (let k = 0; k < filled; k++) {
    const i = (head - 1 - k + cap * 2) % cap;
    const t = ring.t[i];
    if (t < tMin) break;
    const col = Math.min(PLOT_W - 1, Math.max(0, Math.floor((t - tMin) / WINDOW_S * PLOT_W)));
    const v = ring.v[i];
    if (v < colMin[col]) colMin[col] = v;
    if (v > colMax[col]) colMax[col] = v;
  }

  ctx.strokeStyle = getComputedStyle(document.documentElement)
                      .getPropertyValue('--trace').trim() || '#ff5a5f';
  ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath();
  let started = false;
  for (let col = 0; col < PLOT_W; col++) {
    if (colMax[col] === -Infinity) continue;
    const x = PAD_L + col;
    if (!started) { ctx.moveTo(x, yOf(colMax[col])); started = true; }
    // vertical extent of this column, so fast upstrokes stay full height
    ctx.lineTo(x, yOf(colMax[col]));
    ctx.lineTo(x, yOf(colMin[col]));
  }
  ctx.stroke();
}
requestAnimationFrame(draw);

// ---------------------------------------------------------------- stats
setInterval(() => {
  const $ = id => document.getElementById(id);
  if (steps.length) {
    const mean = steps.reduce((a, b) => a + b, 0) / steps.length;
    const sd = Math.sqrt(steps.reduce((a, b) => a + (b - mean) ** 2, 0) / steps.length);
    $('s-rate').textContent = (1e6 / mean).toFixed(1);
    $('s-jit').textContent = sd.toFixed(0);
  }
  $('s-drop').textContent = dropped;
  $('s-pkt').textContent = (pktTimes.length / 2).toFixed(1);
  if (ring && filled > 2) {
    $('s-span').textContent = Math.round(hiY - loY);
  }
}, 500);

// ---------------------------------------------------------------- BLE
const pill = document.getElementById('pill'), btn = document.getElementById('connect');
const status = (t, c) => { pill.textContent = t; pill.className = c || ''; };

let device = null;
async function attach() {
  status('connecting…');
  const server = await device.gatt.connect();
  const tx = await (await server.getPrimaryService(NUS)).getCharacteristic(TX);
  await tx.startNotifications();
  tx.addEventListener('characteristicvaluechanged', e => onPacket(e.target.value));
  status('streaming', 'on');
}

async function onDrop() {
  status('sensor dropped — reconnecting…', 'err');
  for (let i = 0; i < 8; i++) {
    await new Promise(r => setTimeout(r, 1200));
    try { await attach(); return; } catch (e) { /* keep trying */ }
  }
  status('disconnected', 'err');
}

btn.addEventListener('click', async () => {
  if (!navigator.bluetooth) {
    status('needs Chrome over http://localhost', 'err'); return;
  }
  btn.disabled = true;
  try {
    // Filter on the service, not the name: macOS caches GAP names and can show
    // a stale one, so a name filter would hide a perfectly good sensor.
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [NUS] }] });
    device.addEventListener('gattserverdisconnected', onDrop);
    await attach();
  } catch (e) {
    status(e.name === 'NotFoundError' ? 'nothing picked' : (e.message || String(e)), 'err');
  } finally { btn.disabled = false; }
});

// A sensor already permitted on this origin reconnects with no chooser at all.
(async () => {
  try {
    if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
    for (const d of await navigator.bluetooth.getDevices()) {
      device = d;
      d.addEventListener('gattserverdisconnected', onDrop);
      attach().catch(() => status('sensor asleep — press Connect', 'err'));
      break;
    }
  } catch (e) { /* not available everywhere; the button still works */ }
})();

window.__pw = { onPacket, get stats() {
  return { rate, dropped, filled, cap, steps: steps.length, loY, hiY };
} };
</script>
